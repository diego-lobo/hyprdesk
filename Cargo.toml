[package]
name = "hyprdesk"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Shared-monitor virtual desktops for Hyprland, driven over stable IPC"
authors = ["Diego Lobato"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/diego-lobo/hyprdesk"
homepage = "https://github.com/diego-lobo/hyprdesk"
keywords = ["hyprland", "wayland", "workspaces", "multi-monitor", "omarchy"]
categories = ["command-line-utilities"]
exclude = ["assets/", "docs/", "reference/", ".github/"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Doc-noise lints: a small binary crate; the typed Error enum and the
# documented panics-free invariants carry this information already.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
